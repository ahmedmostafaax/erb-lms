services:
  mongo:
    image: mongo:7
    container_name: lms_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - lms_network

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: always
    networks:
      - lms_network

  backend:
    build:
      context: ./lms-backend-v4
      dockerfile: Dockerfile
    container_name: lms_backend
    restart: always
    env_file: ./lms-backend-v4/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/lms
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    networks:
      - lms_network

  frontend:
    build:
      context: ./lms-frontend
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://ec2-63-184-39-37.eu-central-1.compute.amazonaws.com/api
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 338039635571-7svt7atubg8kgpvnb9aa0qfv3t33uurc.apps.googleusercontent.com
    container_name: lms_frontend
    restart: always
    networks:
      - lms_network

  nginx:
    image: nginx:alpine
    container_name: lms_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - lms_network

  certbot:
    image: certbot/certbot
    container_name: lms_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  mongo_data:

networks:
  lms_network:
    driver: bridge
