version: "3.9"
services:
  backend:
    build: .
    container_name: lms_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/lms
    depends_on:
      - mongo
    networks:
      - lms_network
  mongo:
    image: mongo:7
    container_name: lms_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - lms_network
  nginx:
    image: nginx:alpine
    container_name: lms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - lms_network
volumes:
  mongo_data:
networks:
  lms_network:
    driver: bridge
