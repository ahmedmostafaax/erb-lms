version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: lms_backend_dev
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/lms
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
    networks:
      - lms_network
  mongo:
    image: mongo:7
    container_name: lms_mongo_dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - lms_network
  redis:
    image: redis:7-alpine
    container_name: lms_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - lms_network
volumes:
  mongo_data_dev:
networks:
  lms_network:
    driver: bridge