resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name ec2-63-184-39-37.eu-central-1.compute.amazonaws.com 63.184.39.37 _;
    client_max_body_size 50M;

    location /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $backend_host backend;
        proxy_pass http://$backend_host:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        set $frontend_host frontend;
        proxy_pass http://$frontend_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
