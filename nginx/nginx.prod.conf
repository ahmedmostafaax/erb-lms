# استبدل YOUR_DOMAIN في كل مكان تحت بالـ Public DNS بتاع الـ EC2 (مثال: ec2-3-91-45-12.compute-1.amazonaws.com)

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # مطلوب عشان certbot يتحقق إنك مالك الدومين
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # أي طلب تاني يتحول لـ HTTPS إجباري
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # الـ API كله بيروح للباك اند
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # كل حاجة تانية بتروح للفرونت إند
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
